# Master Legends League — vhost isolado (não reutiliza certs de outros sites)
# Proxy para stack MLL no host :4000 (container interno :4100)

server {
    listen 80;
    listen [::]:80;
    server_name masterlegends.online www.masterlegends.online;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    include /etc/nginx/conf.d/sensitive-deny.inc;

    location / {
        return 301 https://masterlegends.online$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name masterlegends.online www.masterlegends.online;

    ssl_certificate /etc/letsencrypt/live/masterlegends.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/masterlegends.online/privkey.pem;

    ssl_session_cache shared:le_nginx_SSL:10m;
    ssl_session_timeout 1440m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    include /etc/nginx/conf.d/sensitive-deny.inc;

    client_max_body_size 25m;

    location / {
        limit_req zone=perip burst=200 nodelay;
        proxy_pass http://172.20.0.1:4000;
        proxy_http_version 1.1;
        proxy_connect_timeout 75s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_buffering on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
    }

    location /socket.io/ {
        proxy_pass http://172.20.0.1:4000;
        proxy_http_version 1.1;
        proxy_connect_timeout 75s;
        proxy_send_timeout 86400s;
        proxy_read_timeout 86400s;
        proxy_buffering off;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
