<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#000000" />
    <title>MLL Stadium Live</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        color: #a7f3d0;
        font-family: monospace;
        display: grid;
        place-items: center;
        text-align: center;
      }
      .pulse {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #ef4444;
        box-shadow: 0 0 10px #ef4444;
        display: inline-block;
        margin-right: 8px;
        animation: blink 1s infinite alternate;
      }
      @keyframes blink {
        from {
          opacity: 0.4;
        }
        to {
          opacity: 1;
        }
      }
      a {
        color: #34d399;
      }
    </style>
  </head>
  <body>
    <div>
      <p><span class="pulse"></span>MLL STADIUM LIVE</p>
      <p style="opacity: 0.7; font-size: 12px">
        Abrindo o campo ao vivo…
      </p>
      <p style="opacity: 0.5; font-size: 11px; margin-top: 16px">
        Fallback:
        <a id="fallback" href="http://143.20.50.96/club/stadium/live">abrir o campo</a>
      </p>
    </div>
    <script>
      // Capacit or Electron: prefer configured server / shell URL.
      const params = new URLSearchParams(location.search);
      const base =
        params.get('base') ||
        localStorage.getItem('mllBaseUrl') ||
        'http://143.20.50.96';
      const target = base.replace(/\/$/, '') + '/club/stadium/live?widget=1';
      const fallback = document.getElementById('fallback');
      if (fallback) fallback.href = target;
      setTimeout(function () {
        location.replace(target);
      }, 400);
    </script>
  </body>
</html>
