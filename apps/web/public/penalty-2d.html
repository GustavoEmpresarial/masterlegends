<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pênalti 2D — lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    :root { --gold:#ffd400; --ink:#071018; }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; min-height: 100%;
      background: radial-gradient(ellipse at 50% 10%, #1a3a28 0%, #061018 60%);
      color: #fff; font-family: "Chakra Petch", sans-serif;
      user-select: none; -webkit-user-select: none;
    }
    .wrap { max-width: 1120px; margin: 0 auto; padding: 14px 14px 24px; }
    .bar {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      margin-bottom: 10px; font-size: 13px; font-weight: 700; letter-spacing: .03em;
    }
    .bar button, .done button {
      font: inherit; font-weight: 700; border: 2px solid var(--gold);
      background: var(--gold); color: var(--ink); padding: 7px 14px; cursor: pointer;
    }
    .stage {
      position: relative; width: 100%; aspect-ratio: 16/9;
      border: 3px solid #244a34; overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,.5); background: #0a1a12;
      touch-action: none;
    }
    canvas { display: block; width: 100%; height: 100%; cursor: crosshair; image-rendering: pixelated; }
    .hud {
      position: absolute; left: 12px; top: 10px; right: 12px;
      display: flex; justify-content: space-between; pointer-events: none;
      font-size: 15px; font-weight: 700; text-shadow: 0 2px 0 #000, 0 0 8px #000;
    }
    .hint {
      position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%);
      pointer-events: none; font-size: 13px; font-weight: 700;
      background: rgba(0,0,0,.55); padding: 7px 14px; border: 1px solid rgba(255,255,255,.18);
      white-space: nowrap;
    }
    .banner {
      position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
      pointer-events: none; font-size: clamp(48px, 9vw, 84px); font-weight: 700;
      letter-spacing: .06em; text-shadow: 0 5px 0 #000, 0 0 40px rgba(0,0,0,.7);
    }
    .banner.on { display: flex; }
    .banner.goal { color: var(--gold); }
    .banner.save { color: #7dd3fc; }
    .done {
      position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
      flex-direction: column; gap: 14px; background: rgba(0,0,0,.58); z-index: 5;
    }
    .done.on { display: flex; }
    .done strong { font-size: 28px; letter-spacing: .05em; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="bar">
      <span>PÊNALTI 2D · segura no gol · canto = gol · meio = defesa</span>
      <button type="button" id="restart">RECOMEÇAR</button>
    </div>
    <div class="stage" id="stage">
      <canvas id="cv"></canvas>
      <div class="hud"><span id="score">GOLS 0</span><span id="left">CHUTES 3</span></div>
      <div class="hint" id="hint">SEGURA NO GOL E SOLTA PRA CHUTAR</div>
      <div class="banner" id="banner"></div>
      <div class="done" id="done">
        <strong id="doneMsg">FIM</strong>
        <button type="button" id="again">JOGAR DE NOVO</button>
      </div>
    </div>
  </div>
<script>
(() => {
  const ATTEMPTS = 3;
  const cv = document.getElementById('cv');
  const stage = document.getElementById('stage');
  const scoreEl = document.getElementById('score');
  const leftEl = document.getElementById('left');
  const hintEl = document.getElementById('hint');
  const bannerEl = document.getElementById('banner');
  const doneEl = document.getElementById('done');
  const doneMsg = document.getElementById('doneMsg');

  // Layout em % do canvas — enquadrado na área do pênalti
  const L = {
    goal: { x: 0.865, y: 0.22, w: 0.115, h: 0.56 },
    spot: { x: 0.58, y: 0.52 },
    runFrom: { x: 0.42, y: 0.62 },
    runTo: { x: 0.545, y: 0.535 },
  };

  // Crop da foto: foca na área do pênalti (direita do campo)
  const CROP = { sx: 0.38, sy: 0.08, sw: 0.60, sh: 0.84 };

  let W = 0, H = 0, dpr = 1;
  let phase = 'aiming';
  let charge = 0;
  let aim = { nx: 0.5, ny: 0.5 };
  let shotAim = null;
  let scored = null;
  let goals = 0;
  let shotsLeft = ATTEMPTS;
  let anim = { run: 0, kick: 0, fly: 0, t0: 0 };
  let busy = false;
  let holding = false;
  let shake = 0;
  let flash = 0;
  const dust = [];
  const trail = [];

  const pitchImg = new Image();
  pitchImg.src = '/ui/stadiums/campo-penalti.jpg';
  let imgReady = false;
  pitchImg.onload = () => { imgReady = true; };

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const easeOut = (t) => 1 - (1 - t) ** 3;
  const easeInOut = (t) => (t < 0.5 ? 2 * t * t : 1 - (-2 * t + 2) ** 2 / 2);

  function resize() {
    const r = stage.getBoundingClientRect();
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = Math.max(1, Math.floor(r.width));
    H = Math.max(1, Math.floor(r.height));
    cv.width = Math.floor(W * dpr);
    cv.height = Math.floor(H * dpr);
    cv.style.width = W + 'px';
    cv.style.height = H + 'px';
    const ctx = cv.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.imageSmoothingEnabled = false;
  }

  function px(n) { return { x: W * n.x, y: H * n.y, w: W * (n.w || 0), h: H * (n.h || 0) }; }

  function pointerNorm(clientX, clientY) {
    const r = cv.getBoundingClientRect();
    return { nx: (clientX - r.left) / r.width, ny: (clientY - r.top) / r.height };
  }

  function inGoal(nx, ny) {
    const g = L.goal;
    return nx >= g.x && nx <= g.x + g.w && ny >= g.y && ny <= g.y + g.h;
  }

  function decideShot(nx, ny) {
    return Math.abs(nx - 0.5) > 0.22 || Math.abs(ny - 0.5) > 0.22;
  }

  function updateHud() {
    scoreEl.textContent = 'GOLS ' + goals;
    leftEl.textContent = 'CHUTES ' + shotsLeft;
    if (phase === 'aiming') hintEl.textContent = 'SEGURA NO GOL E SOLTA PRA CHUTAR';
    else if (phase === 'charging') hintEl.textContent = 'CARREGANDO… SOLTA PRA CORRER';
    else if (phase === 'runup' || phase === 'kick') hintEl.textContent = 'CORRIDA…';
    else if (phase === 'flying') hintEl.textContent = 'BOLA NO AR';
    else hintEl.textContent = '';
  }

  function showBanner(text, cls) {
    bannerEl.textContent = text;
    bannerEl.className = 'banner on ' + cls;
  }
  function hideBanner() {
    bannerEl.className = 'banner';
    bannerEl.textContent = '';
  }

  function resetRound(keepScore) {
    phase = 'aiming';
    charge = 0;
    aim = { nx: 0.5, ny: 0.5 };
    shotAim = null;
    scored = null;
    anim = { run: 0, kick: 0, fly: 0, t0: 0 };
    busy = false;
    holding = false;
    shake = 0;
    flash = 0;
    dust.length = 0;
    trail.length = 0;
    hideBanner();
    if (!keepScore) {
      goals = 0;
      shotsLeft = ATTEMPTS;
      doneEl.className = 'done';
    }
    updateHud();
  }

  function finishRound() {
    phase = 'result';
    showBanner(scored ? 'GOOOL!' : 'DEFENDEU!', scored ? 'goal' : 'save');
    updateHud();
    setTimeout(() => {
      hideBanner();
      if (shotsLeft <= 0) {
        phase = 'done';
        doneMsg.textContent = goals > 0 ? ('VENCEU · ' + goals + ' GOL(S)') : 'PERDEU · 0 GOLS';
        doneEl.className = 'done on';
      } else {
        phase = 'aiming';
        charge = 0;
        shotAim = null;
        scored = null;
        anim = { run: 0, kick: 0, fly: 0, t0: 0 };
        busy = false;
        dust.length = 0;
        trail.length = 0;
      }
      updateHud();
    }, 1200);
  }

  function fire() {
    if (busy || phase !== 'charging') return;
    busy = true;
    shotAim = { ...aim };
    scored = decideShot(aim.nx, aim.ny);
    if (scored) goals += 1;
    shotsLeft = Math.max(0, shotsLeft - 1);
    anim = { run: 0, kick: 0, fly: 0, t0: performance.now() };
    phase = 'runup';
    updateHud();
  }

  function spawnDust(x, y, n) {
    for (let i = 0; i < n; i++) {
      dust.push({
        x: x + (Math.random() - 0.5) * 10,
        y: y + (Math.random() - 0.5) * 6,
        vx: (Math.random() - 0.5) * 1.2,
        vy: (Math.random() - 0.5) * 0.8,
        life: 1,
        s: 2 + Math.random() * 3,
      });
    }
  }

  // ── pixel helpers ──
  function pxFill(ctx, x, y, w, h, c) {
    ctx.fillStyle = c;
    ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
  }

  /**
   * Boneco pixel estilo estádio, mas DESENHADO DE CIMA (cabeça no centro-frente,
   * ombros/tronco oval, pernas pra trás do movimento).
   */
  function drawTopBoneco(ctx, x, y, facing, kit, pose, label, now, isGk) {
    const S = Math.max(2.6, H * 0.0062);
    const bob = pose === 'run' ? Math.sin(now * 0.022) * 1.5 * S : pose === 'kick' ? -1.2 * S : Math.sin(now * 0.004) * 0.4 * S;
    const stride = pose === 'run' ? Math.sin(now * 0.03) : 0;
    const kick = pose === 'kick' ? 1 : 0;

    ctx.save();
    ctx.translate(Math.round(x), Math.round(y + bob));
    ctx.rotate(facing);
    ctx.imageSmoothingEnabled = false;

    // sombra no chão
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.beginPath();
    ctx.ellipse(0, 2 * S, 7 * S, 3.2 * S, 0, 0, Math.PI * 2);
    ctx.fill();

    // anel raridade
    ctx.strokeStyle = isGk ? '#38bdf8aa' : '#f87171aa';
    ctx.lineWidth = Math.max(1.5, S * 0.45);
    ctx.beginPath();
    ctx.ellipse(0, 2.2 * S, 8.2 * S, 3.6 * S, 0, 0, Math.PI * 2);
    ctx.stroke();

    // pernas (atrás do corpo no eixo local +Y = costas)
    const legOff = stride * 3.2 * S;
    const kickOff = kick * 5.5 * S;
    // pé esquerdo / direito
    pxFill(ctx, -3.2 * S - legOff * 0.3, 3.5 * S + Math.abs(legOff) * 0.1, 2.6 * S, 4.2 * S, '#111827');
    pxFill(ctx, 0.8 * S + legOff * 0.3, 3.5 * S + kickOff * 0.15, 2.6 * S, 4.2 * S + kick * S, '#111827');
    // meião
    pxFill(ctx, -3 * S - legOff * 0.3, 2.2 * S, 2.2 * S, 2.2 * S, isGk ? '#0c4a6e' : '#1e293b');
    pxFill(ctx, 1 * S + legOff * 0.3, 2.2 * S + kickOff * 0.1, 2.2 * S, 2.2 * S, isGk ? '#0c4a6e' : '#1e293b');

    // shorts
    pxFill(ctx, -4 * S, 0.2 * S, 8 * S, 3.2 * S, kit.shorts);
    pxFill(ctx, -1 * S, 0.2 * S, 2 * S, 3.2 * S, 'rgba(0,0,0,0.25)');

    // tronco
    pxFill(ctx, -4.5 * S, -4.5 * S, 9 * S, 5.5 * S, kit.shirt);
    pxFill(ctx, -4.5 * S, -4.5 * S, 9 * S, 1.2 * S, kit.stripe || 'rgba(255,255,255,0.15)');
    // número
    pxFill(ctx, -1.2 * S, -2.8 * S, 2.4 * S, 2.8 * S, 'rgba(255,255,255,0.35)');

    // braços
    const arm = pose === 'kick' ? 2.8 * S : pose === 'run' ? -stride * 2.2 * S : 0;
    pxFill(ctx, -6.2 * S, -3 * S + arm * 0.3, 2.2 * S, 3.5 * S, kit.shirt);
    pxFill(ctx, 4 * S, -3 * S - arm * 0.3, 2.2 * S, 3.5 * S, kit.shirt);
    pxFill(ctx, -6.2 * S, 0.2 * S + arm * 0.3, 2.2 * S, 1.8 * S, '#e8b888');
    pxFill(ctx, 4 * S, 0.2 * S - arm * 0.3, 2.2 * S, 1.8 * S, '#e8b888');

    // cabeça (frente = -Y)
    pxFill(ctx, -3.2 * S, -9.2 * S, 6.4 * S, 5.2 * S, '#e8b888');
    // cabelo
    pxFill(ctx, -3.4 * S, -10.2 * S, 6.8 * S, 2.4 * S, '#1c1410');
    pxFill(ctx, -3.4 * S, -8.4 * S, 1.4 * S, 2.2 * S, '#1c1410');
    pxFill(ctx, 2 * S, -8.4 * S, 1.4 * S, 2.2 * S, '#1c1410');
    // olhos
    pxFill(ctx, -1.8 * S, -7.2 * S, 1.1 * S, 1.1 * S, '#111');
    pxFill(ctx, 0.7 * S, -7.2 * S, 1.1 * S, 1.1 * S, '#111');

    // luva GK
    if (isGk) {
      pxFill(ctx, -6.4 * S, 0.4 * S + arm * 0.3, 2.6 * S, 2.2 * S, '#fbbf24');
      pxFill(ctx, 3.8 * S, 0.4 * S - arm * 0.3, 2.6 * S, 2.2 * S, '#fbbf24');
    }

    ctx.restore();

    // label
    ctx.save();
    ctx.font = 'bold ' + Math.max(12, H * 0.03) + 'px "Chakra Petch", sans-serif';
    ctx.textAlign = 'center';
    ctx.lineWidth = 3;
    ctx.strokeStyle = '#000';
    ctx.fillStyle = '#fff';
    ctx.strokeText(label, x, y - 14 * S);
    ctx.fillText(label, x, y - 14 * S);
    ctx.restore();
  }

  function drawBall(ctx, x, y, scale, spin) {
    const r = Math.max(8, H * 0.02) * (scale || 1);
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.beginPath();
    ctx.ellipse(x + 2, y + r * 0.75, r * 1.05, r * 0.4, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.translate(x, y);
    ctx.rotate(spin || 0);
    ctx.fillStyle = '#f8fafc';
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#0f172a';
    ctx.lineWidth = Math.max(1.5, r * 0.12);
    ctx.stroke();
    // painéis
    ctx.fillStyle = '#0f172a';
    for (let i = 0; i < 5; i++) {
      const a = (i / 5) * Math.PI * 2;
      ctx.beginPath();
      ctx.arc(Math.cos(a) * r * 0.35, Math.sin(a) * r * 0.35, r * 0.22, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawPitch(ctx) {
    if (imgReady) {
      const iw = pitchImg.naturalWidth;
      const ih = pitchImg.naturalHeight;
      const sx = iw * CROP.sx;
      const sy = ih * CROP.sy;
      const sw = iw * CROP.sw;
      const sh = ih * CROP.sh;
      ctx.imageSmoothingEnabled = true;
      ctx.drawImage(pitchImg, sx, sy, sw, sh, 0, 0, W, H);
      ctx.imageSmoothingEnabled = false;
    } else {
      ctx.fillStyle = '#2a7a35';
      ctx.fillRect(0, 0, W, H);
    }
    // vinheta
    const g = ctx.createRadialGradient(W * 0.55, H * 0.5, H * 0.15, W * 0.55, H * 0.5, H * 0.75);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(1, 'rgba(0,0,0,0.35)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }

  function drawGoal(ctx) {
    const g = px(L.goal);
    const post = Math.max(7, H * 0.016);
    // sombra atrás
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fillRect(g.x + 4, g.y + 6, g.w, g.h);

    // fundo da rede
    ctx.fillStyle = 'rgba(12, 20, 28, 0.55)';
    ctx.fillRect(g.x + post, g.y + post, g.w - post, g.h - post);

    // malha
    ctx.save();
    ctx.beginPath();
    ctx.rect(g.x + post, g.y + post, g.w - post, g.h - post);
    ctx.clip();
    ctx.strokeStyle = 'rgba(236, 242, 248, 0.55)';
    ctx.lineWidth = 1.2;
    const step = Math.max(10, H * 0.028);
    for (let x = g.x; x < g.x + g.w + step; x += step) {
      ctx.beginPath(); ctx.moveTo(x, g.y); ctx.lineTo(x + g.h * 0.15, g.y + g.h); ctx.stroke();
    }
    for (let y = g.y; y < g.y + g.h + step; y += step) {
      ctx.beginPath(); ctx.moveTo(g.x, y); ctx.lineTo(g.x + g.w, y); ctx.stroke();
    }
    ctx.restore();

    // traves brancas grossas
    ctx.fillStyle = '#f8fafc';
    ctx.fillRect(g.x, g.y, post, g.h);                 // trave perto
    ctx.fillRect(g.x + g.w - post * 0.7, g.y, post * 0.7, g.h); // fundo
    ctx.fillRect(g.x, g.y, g.w, post);                  // travessão
    // brilho
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.fillRect(g.x + 2, g.y + 2, post - 3, g.h - 4);
    ctx.fillRect(g.x + 2, g.y + 2, g.w - 4, 3);

    // boca do gol highlight
    ctx.strokeStyle = 'rgba(255,212,0,0.25)';
    ctx.lineWidth = 2;
    ctx.strokeRect(g.x + post, g.y + post, g.w - post * 1.5, g.h - post);
  }

  function drawAim(ctx) {
    const g = px(L.goal);
    const post = Math.max(7, H * 0.016);
    const x = g.x + post + (g.w - post * 1.5) * aim.nx;
    const y = g.y + post + (g.h - post) * aim.ny;
    const s = Math.max(12, H * 0.032);
    ctx.save();
    ctx.strokeStyle = phase === 'charging' ? '#ffd400' : '#fff';
    ctx.lineWidth = 2.5;
    ctx.shadowColor = phase === 'charging' ? '#ffd400' : '#fff';
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.moveTo(x - s, y); ctx.lineTo(x + s, y);
    ctx.moveTo(x, y - s); ctx.lineTo(x, y + s);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(x, y, s * 0.55, 0, Math.PI * 2);
    ctx.stroke();
    ctx.shadowBlur = 0;

    if (phase === 'charging') {
      const spot = px(L.spot);
      ctx.strokeStyle = 'rgba(255,212,0,' + (0.3 + charge * 0.5) + ')';
      ctx.setLineDash([7, 6]);
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(spot.x, spot.y);
      ctx.lineTo(x, y);
      ctx.stroke();
      ctx.setLineDash([]);

      const bw = W * 0.24, bh = 12;
      const bx = W * 0.5 - bw / 2, by = H * 0.905;
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(bx - 3, by - 3, bw + 6, bh + 6);
      ctx.fillStyle = '#1f2937';
      ctx.fillRect(bx, by, bw, bh);
      ctx.fillStyle = charge > 0.85 ? '#ef4444' : '#ffd400';
      ctx.fillRect(bx, by, bw * charge, bh);
      ctx.font = 'bold 11px "Chakra Petch", sans-serif';
      ctx.fillStyle = '#fff';
      ctx.textAlign = 'center';
      ctx.fillText(Math.round(charge * 100) + '%', W * 0.5, by - 6);
    }
    ctx.restore();
  }

  function frame(now) {
    const ctx = cv.getContext('2d');
    if (!ctx || !W) { requestAnimationFrame(frame); return; }

    if (phase === 'runup') {
      anim.run = clamp((now - anim.t0) / 560, 0, 1);
      if (anim.run >= 1) { phase = 'kick'; anim.t0 = now; updateHud(); }
    } else if (phase === 'kick') {
      anim.kick = clamp((now - anim.t0) / 160, 0, 1);
      if (anim.kick >= 1) {
        phase = 'flying';
        anim.t0 = now;
        shake = 10;
        flash = 1;
        spawnDust(px(L.spot).x, px(L.spot).y, 10);
        updateHud();
      }
    } else if (phase === 'flying') {
      anim.fly = clamp((now - anim.t0) / 720, 0, 1);
      if (anim.fly >= 1 && scored !== null && busy) {
        busy = false;
        finishRound();
      }
    } else if (phase === 'charging' && holding) {
      charge = clamp(charge + 0.016, 0, 1);
    }

    shake *= 0.85;
    flash *= 0.88;
    for (let i = dust.length - 1; i >= 0; i--) {
      const d = dust[i];
      d.x += d.vx; d.y += d.vy; d.life -= 0.03;
      if (d.life <= 0) dust.splice(i, 1);
    }

    const ox = (Math.random() - 0.5) * shake;
    const oy = (Math.random() - 0.5) * shake;

    ctx.save();
    ctx.translate(ox, oy);

    drawPitch(ctx);
    drawGoal(ctx);

    const spot = px(L.spot);
    const g = px(L.goal);
    const post = Math.max(7, H * 0.016);

    // keeper
    let gkX = g.x + g.w * 0.28;
    let gkY = g.y + g.h * 0.5;
    if (shotAim && (phase === 'flying' || phase === 'result' || phase === 'kick')) {
      const diveX = g.x + post + (g.w - post * 1.5) * shotAim.nx;
      const diveY = g.y + post + (g.h - post) * shotAim.ny;
      const t = phase === 'flying' ? easeOut(anim.fly) : 1;
      if (!scored) {
        gkX = lerp(gkX, diveX, t);
        gkY = lerp(gkY, diveY, t);
      } else {
        gkX = lerp(gkX, diveX + (diveX > gkX ? -55 : 55), t * 0.75);
        gkY = lerp(gkY, diveY + (diveY > H * 0.5 ? 20 : -20), t * 0.45);
      }
    } else {
      gkY += Math.sin(now * 0.0035) * 8;
    }

    const from = px(L.runFrom);
    const to = px(L.runTo);
    let sx = from.x, sy = from.y;
    let pose = 'idle';
    let facing = Math.atan2(spot.y - from.y, spot.x - from.x) + Math.PI / 2;

    if (phase === 'runup') {
      const t = easeInOut(anim.run);
      sx = lerp(from.x, to.x, t);
      sy = lerp(from.y, to.y, t);
      pose = 'run';
      facing = Math.atan2(to.y - from.y, to.x - from.x) + Math.PI / 2;
      if (Math.random() < 0.35) spawnDust(sx, sy + 8, 1);
    } else if (phase === 'kick') {
      sx = to.x; sy = to.y; pose = 'kick';
      facing = Math.atan2(spot.y - to.y, spot.x - to.x) + Math.PI / 2;
    } else if (phase === 'flying' || phase === 'result' || phase === 'done') {
      sx = to.x; sy = to.y; pose = 'idle';
      facing = Math.atan2(spot.y - to.y, spot.x - to.x) + Math.PI / 2;
    }

    // bola
    let bx = spot.x, by = spot.y, bscale = 1, spin = now * 0.002;
    if (shotAim && (phase === 'flying' || phase === 'result')) {
      const tx = g.x + post + (g.w - post * 1.5) * shotAim.nx;
      const ty = g.y + post + (g.h - post) * shotAim.ny;
      const t = phase === 'result' ? 1 : easeOut(anim.fly);
      bx = lerp(spot.x, tx, t);
      by = lerp(spot.y, ty, t);
      // arco leve
      by -= Math.sin(t * Math.PI) * H * 0.04;
      bscale = 1 + Math.sin(t * Math.PI) * 0.35;
      spin = t * 10;
      trail.push({ x: bx, y: by, life: 1 });
      if (trail.length > 14) trail.shift();
      if (!scored && t > 0.72) {
        bx = lerp(bx, gkX, (t - 0.72) / 0.28 * 0.55);
        by = lerp(by, gkY, (t - 0.72) / 0.28 * 0.55);
      }
    }

    // trail
    for (let i = 0; i < trail.length; i++) {
      const t = trail[i];
      t.life -= 0.06;
      ctx.fillStyle = 'rgba(255,255,255,' + (t.life * 0.35) + ')';
      ctx.beginPath();
      ctx.arc(t.x, t.y, 4 * t.life, 0, Math.PI * 2);
      ctx.fill();
    }
    for (let i = trail.length - 1; i >= 0; i--) if (trail[i].life <= 0) trail.splice(i, 1);

    // dust
    for (const d of dust) {
      ctx.fillStyle = 'rgba(210,190,140,' + (d.life * 0.55) + ')';
      ctx.fillRect(d.x, d.y, d.s, d.s);
    }

    if (phase !== 'flying' && phase !== 'result') drawBall(ctx, bx, by, 1, spin);

    const youKit = { shirt: '#c04848', shorts: '#1e293b', stripe: 'rgba(255,255,255,0.2)' };
    const gkKit = { shirt: '#0ea5e9', shorts: '#0c4a6e', stripe: 'rgba(255,255,255,0.15)' };
    const gkFacing = Math.atan2(spot.y - gkY, spot.x - gkX) + Math.PI / 2;

    drawTopBoneco(ctx, gkX, gkY, gkFacing, gkKit, phase === 'flying' && !scored ? 'kick' : 'idle', 'GK', now, true);
    drawTopBoneco(ctx, sx, sy, facing, youKit, pose, 'VOCÊ', now, false);

    if (phase === 'flying' || phase === 'result') drawBall(ctx, bx, by, bscale, spin);

    if (phase === 'aiming' || phase === 'charging') drawAim(ctx);

    if (flash > 0.05) {
      ctx.fillStyle = 'rgba(255,255,255,' + (flash * 0.35) + ')';
      ctx.fillRect(0, 0, W, H);
    }

    ctx.restore();
    requestAnimationFrame(frame);
  }

  function onDown(e) {
    if (phase !== 'aiming') return;
    const p = e.touches ? e.touches[0] : e;
    const n = pointerNorm(p.clientX, p.clientY);
    if (!inGoal(n.nx, n.ny)) return;
    e.preventDefault();
    aim = {
      nx: clamp((n.nx - L.goal.x) / L.goal.w, 0, 1),
      ny: clamp((n.ny - L.goal.y) / L.goal.h, 0, 1),
    };
    phase = 'charging';
    charge = 0;
    holding = true;
    updateHud();
  }
  function onMove(e) {
    const p = e.touches ? e.touches[0] : e;
    const n = pointerNorm(p.clientX, p.clientY);
    if (phase === 'charging' && holding && inGoal(n.nx, n.ny)) {
      aim = {
        nx: clamp((n.nx - L.goal.x) / L.goal.w, 0, 1),
        ny: clamp((n.ny - L.goal.y) / L.goal.h, 0, 1),
      };
    }
  }
  function onUp() {
    if (phase === 'charging' && holding) {
      holding = false;
      fire();
    }
  }

  cv.addEventListener('mousedown', onDown);
  cv.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup', onUp);
  cv.addEventListener('touchstart', onDown, { passive: false });
  cv.addEventListener('touchmove', onMove, { passive: false });
  window.addEventListener('touchend', onUp);
  document.getElementById('restart').onclick = () => resetRound(false);
  document.getElementById('again').onclick = () => resetRound(false);
  window.addEventListener('resize', resize);
  resize();
  updateHud();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
